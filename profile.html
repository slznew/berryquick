<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Сервис для прослушивания музыки - Макет страницы "Профиль"</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="./styles/style.css"/>
</head>
<body>
<div>
	<nav class="sidebar justify-content-between">
        <div class="d-flex flex-column align-items-center gap-5 w-100">
            <a href="./index.html" title="Главная страница"><img src="./icons/mini-logo.svg" width="44px" height="70px"></a>
            <div class="d-flex flex-column align-items-center gap-4 w-100">
                <a href="./playlists.html" title="Плейлисты"><img src="./icons/playlists.svg" width="50px" height="38px"></a>
                <a href="./compilations.html" title="Подборки"><img src="./icons/compilations.svg" width="50px" height="50px"></a>
                <a href="./saved.html" title="Избранное"><img src="./icons/heart.svg" width="50px" height="44px"></a>
            </div>
        </div>
        <a href="./profile.html" title="Профиль"><img src="./icons/profile.svg" width="50px" height="44px"></a>
    </nav>
	<main class="profile-wrapper flex-grow-1 mb-5 pb-5">
        <div class="small-margin">
            <button class="btn btn-outline back-btn" onclick="window.history.back()">Назад</button>
        </div>
		<div class="page-header">
            <img class="avatar" src="./images/cat.svg">
			<h1 class="current-title main-title">slznew</h1>
		</div>
		<div class="point-list">
            <div class="point-item" onclick="window.location.href = './settings.html';">
                <div class="point-left">
                    <div class="point-info">
                        <div class="player-title">Настройки</div>
                    </div>
                </div>
            </div>
            <div class="point-item" onclick="window.location.href = './auth.html';">
                <div class="point-left">
                    <div class="point-info">
                        <div class="player-title">Выход</div>
                    </div>
                </div>
            </div>
            <div class="point-item">
                <div class="point-left">
                    <div class="point-info">
                        <div class="player-title">Изменение данных</div>
                    </div>
                </div>
            </div>
            <div class="point-item">
                <div class="point-left">
                    <div class="point-info">
                        <div class="player-title">Управление подпиской</div>
                    </div>
                </div>
            </div>
            <div class="point-item">
                <div class="point-left">
                    <div class="point-info">
                        <div class="player-title">Мои плейлисты</div>
                    </div>
                </div>
            </div>
            <div class="point-item">
                <div class="point-left">
                    <div class="point-info">
                        <div class="player-title">Избранное</div>
                    </div>
                </div>
            </div>
        </div>
	</main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/bootstrap.bundle.min.js"></script>
</body>
</html>
