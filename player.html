<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Сервис для прослушивания музыки - Макет страницы "Плеер"</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<meta name="view-transition" content="same-origin">
	<link rel="expect" href=".bottom-player" blocking="render">
	<link rel="stylesheet" href="./styles/style.css"/>
</head>
<body>
<div>
	<nav class="sidebar justify-content-between">
        <div class="d-flex flex-column align-items-center gap-5 w-100">
            <a href="./index.html" title="Главная страница"><img src="./icons/mini-logo.svg" width="44px" height="70px"></a>
            <div class="d-flex flex-column align-items-center gap-4 w-100">
                <a href="./playlists.html" title="Плейлисты"><img src="./icons/playlists.svg" width="50px" height="38px"></a>
                <a href="./compilations.html" title="Подборки"><img src="./icons/compilations.svg" width="50px" height="50px"></a>
                <a href="./saved.html" title="Избранное"><img src="./icons/heart.svg" width="50px" height="44px"></a>
            </div>
        </div>
        <a href="./profile.html" title="Профиль"><img src="./icons/profile.svg" width="50px" height="44px"></a>
    </nav>
  	<main class="main-wrapper flex-grow-1 mb-5 pb-5">
        <form action="./result.html" method="GET" class="search-bar d-flex align-items-center justify-content-between mb-4">
            <input type="text" class="form-control" placeholder="Введите поисковой запрос..." required>
            <button type="submit" class="control-btn search-btn"><img src='./icons/search.svg' width="21px" height="22px"/></button>
        </form>
		<div class="bottom-player full-screen-player d-flex flex-column justify-content-between p-4" onclick="this.classList.add('closing'); setTimeout(() => window.history.back(), 350);">
			<div class="d-flex align-items-end justify-content-between w-100 mb-4">
				<div class="d-flex align-items-end gap-4">
					<img class="player-cover" src='./images/dragonborn.svg'/>
					<div>
						<div class="full-player-title" onclick="event.stopPropagation; window.location.href = './album.html';">Dragonborn</div>
            <div class="full-player-artist" onclick="event.stopPropagation; window.location.href = './artist.html';">Big Baby Tape</div>
					</div>
				</div>
				<div class="player-actions d-flex align-items-center gap-3">
					<span class="control-btn"><img src='./icons/big-heart.svg' width="80px" height="70px"/></span>
        			<span class="control-btn"><img src='./icons/rule.svg' width="76px" height="70px"/></span>
				</div>
			</div>
			<div class="player-progress-container w-100">
				<div class="player-progress-bar">
					<div class="player-progress-fill" style="width: 35%;">
						<div class="player-progress-thumb"></div>
					</div>
				</div>
			</div>
			<div class="full-player-controls d-flex align-items-center justify-content-center">
				<span class="control-btn"><img src='./icons/prev.svg' width="70px" height="70px"/></span>
        		<span class="control-btn"><img src='./icons/play.svg' width="70px" height="70px"/></span>
        		<span class="control-btn"><img src='./icons/next.svg' width="70px" height="70px"/></span>
			</div>
		</div>
	</main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/bootstrap.bundle.min.js"></script>
</body>
</html>
