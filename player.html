<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Сервис для прослушивания музыки - Макет страницы "Плеер"</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="./styles/style.css"/>
</head>
<body>
<div class="d-flex">
  	<nav class="sidebar justify-content-between">
        <div class="d-flex flex-column align-items-center gap-4 w-100">
            <a href="./index.html" class="square-placeholder" title="Главная страница"></a>
            <a href="./playlists.html" class="circle-placeholder" title="Плейлисты"></a>
            <a href="./saved.html" class="circle-placeholder" title="Избранное"></a>
            <a href="./compilations.html" class="circle-placeholder" title="Подборки"></a>
        </div>
        <a href="./profile.html" class="circle-placeholder" title="Профиль"></a>
    </nav>
  	<main class="main-wrapper flex-grow-1 p-4 mb-5 pb-5">
        <form action="./result.html" method="GET" class="search-bar d-flex align-items-center justify-content-between mb-4">
            <input type="text" class="form-control" placeholder="Введите поисковой запрос..." required>
            <button type="submit" class="circle-placeholder control-btn search-btn" style="width: 32px; height: 32px; background-color: #000000;"></button>
        </form>
		<div class="bottom-player full-screen-player d-flex flex-column justify-content-between p-4">
			<div class="d-flex align-items-end justify-content-between w-100 mb-4">
				<div class="d-flex align-items-end gap-4">
					<div class="player-cover"></div>
					<div>
						<div class="fw-bold text-white fs-2" onclick="window.location.href = './album.html';">Lorem ipsum dolor</div>
						<div class="text-light fs-4" onclick="window.location.href = './artist.html';">Lorem ipsum | 20XX</div>
					</div>
				</div>
				<div class="player-controls d-flex align-items-center gap-3">
					<span class="control-btn player-btn" onclick="window.history.back()"></span>
					<span class="control-btn player-btn"></span>
				</div>
			</div>
			<div class="player-progress-container w-100 my-auto">
				<div class="player-progress-bar">
					<div class="player-progress-fill" style="width: 35%;">
						<div class="player-progress-thumb"></div>
					</div>
				</div>
			</div>
			<div class="player-controls d-flex align-items-center justify-content-center gap-4 w-100 mt-4">
				<span class="control-btn player-btn"></span>
				<span class="control-btn player-btn"></span>
				<span class="control-btn player-btn"></span>
			</div>
		</div>
	</main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/bootstrap.bundle.min.js"></script>
</body>
</html>
