<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сервис для прослушивания музыки - Макет страницы "Регитрация/Вход"</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles/style.css"/>
</head>
<body>
<div class="d-flex">
    <nav class="sidebar justify-content-between">
        <div class="d-flex flex-column align-items-center gap-4 w-100">
            <a href="./index.html" class="square-placeholder" title="Главная страница"></a>
            <a href="./playlists.html" class="circle-placeholder" title="Плейлисты"></a>
            <a href="./saved.html" class="circle-placeholder" title="Избранное"></a>
            <a href="./compilations.html" class="circle-placeholder" title="Подборки"></a>
        </div>
        <a href="./profile.html" class="circle-placeholder" title="Профиль"></a>
    </nav>
    <main class="main-wrapper flex-grow-1 p-4 mb-5 pb-5">
        <form action="./result.html" method="GET" class="search-bar d-flex align-items-center justify-content-between mb-4">
            <input type="text" class="form-control" placeholder="Введите поисковой запрос..." required>
            <button type="submit" class="circle-placeholder control-btn search-btn" style="width: 32px; height: 32px; background-color: #000000;"></button>
        </form>
            <section class="auth-section">
                <h1 class="main-title auth-title" id="formTitle">Регистрация</h1>
                <form id="authForm" class="auth-form" onsubmit="return false;">
                    <div class="form-group" id="emailGroup">
                        <label for="emailInput">Почта</label>
                        <input type="email" id="emailInput" class="form-control" placeholder="Введите адрес электронной почты...">
                    </div>
                    <div class="form-group" id="loginGroup">
                        <label for="loginInput">Логин</label>
                        <input type="text" id="loginInput" class="form-control" placeholder="Введите логин..." required>
                    </div>
                    <div class="form-group" id="passwordGroup">
                        <label for="passwordInput">Пароль</label>
                        <input type="password" id="passwordInput" class="form-control" placeholder="Введите пароль..." required>
                    </div>
                    <div class="form-group" id="codeGroup">
                        <label for="codeInput">Код</label>
                        <input type="text" id="codeInput" class="form-control" placeholder="Введите код подтверждения...">
                    </div>
                    <div class="auth-actions">
                        <button type="button" id="registerBtn" class="btn btn-primary">Регистрация</button>
                        <button type="button" id="loginBtn" class="btn btn-outline">Вход</button>
                    </div>
                </form>
            </section>
    </main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/bootstrap.bundle.min.js"></script>
<script src="./scripts/auth.js"></script>    
</body>
</html>
